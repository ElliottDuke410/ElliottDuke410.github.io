<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Centered Table</title>
  <style>
    body {
      background-color: #0b1a2e; /* dark blue */
      color: #f5d76e; /* dark yellow */
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 40px;
    }

    h1 {
      margin-bottom: 30px;
    }

    h2 {
      margin-bottom: 10px;
      color: #8b1e1e; /* dark red */
    }

    table {
      margin: 0 auto; /* centers table */
      border-collapse: collapse;
      background-color: #000; /* black */
      color: #f5d76e;
    }

    td {
      border: 2px solid #8b1e1e;
      padding: 15px 25px;
    }
  </style>
</head>
<body>

  <h1>Main Centered Title</h1>

  <h2>Table Title</h2>

  <table>
    <tr>
      <td>Row 1, Col 1</td>
      <td>Row 1, Col 2</td>
    </tr>
    <tr>
      <td>Row 2, Col 1</td>
      <td>Row 2, Col 2</td>
    </tr>
  </table>

</body>
</html>
